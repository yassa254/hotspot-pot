<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2; url=$(link-redirect)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirPulse // Connected</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="single-page-body">
  <main class="single-page-main">
    <div class="portal-blueprint-container">
      <div class="dashed-section-primitive" style="text-align:center;padding:40px 24px;">
        <div class="success-check-mark">&check;</div>
        <h1 class="blueprint-display-headline" style="font-size:32px;">SESSION LIVE.</h1>
        <p class="blueprint-subtext">You are authenticated on $(identity). Opening the internet...</p>
        <p class="input-helper">User: $(username) &bull; IP: $(ip) &bull; MAC: $(mac)</p>
        <a class="btn-submit-blueprint" href="$(link-redirect)" style="display:inline-flex;margin-top:16px;text-decoration:none;">
          <span>Continue &rarr;</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
