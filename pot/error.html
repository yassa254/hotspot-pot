<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirPulse // Hotspot Error</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="single-page-body">
  <main class="single-page-main">
    <div class="portal-blueprint-container">
      <div class="dashed-section-primitive" style="text-align:center;padding:40px 24px;">
        <div class="hotspot-error-banner" style="display:block;margin-bottom:16px;">$(error)</div>
        <h1 class="blueprint-display-headline" style="font-size:32px;">GATEWAY ERROR.</h1>
        <p class="blueprint-subtext">The hotspot could not complete that request. Try the login page again.</p>
        <a class="btn-submit-blueprint" href="$(link-login)" style="display:inline-flex;margin-top:16px;text-decoration:none;">
          <span>Back to Hotspot Login</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
