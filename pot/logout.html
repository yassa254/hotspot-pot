<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirPulse // Logged Out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="single-page-body">
  <main class="single-page-main">
    <div class="portal-blueprint-container">
      <div class="dashed-section-primitive" style="text-align:center;padding:40px 24px;">
        <h1 class="blueprint-display-headline" style="font-size:32px;">SESSION ENDED.</h1>
        <p class="blueprint-subtext">You have been logged out of $(identity). Reconnect to the hotspot to purchase another pass.</p>
        <a class="btn-submit-blueprint" href="$(link-login)" style="display:inline-flex;margin-top:16px;text-decoration:none;">
          <span>Return to Login</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
